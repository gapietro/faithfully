name: Faithfully
options:
  bundleIdPrefix: com.faithfully
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

targets:
  Faithfully:
    type: application
    platform: iOS
    sources:
      - path: Faithfully
        excludes:
          - "Resources/**"
      - path: Faithfully/Resources/challenges.json
        type: file
        buildPhase: resources
      - path: Faithfully/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        # iPhone only for v1 (PRD). Left at Xcode's universal default, the archive
        # declared UIDeviceFamily [1,2] while configuring only iPhone portrait,
        # which warns at archive time and ships an untested iPad experience.
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.faithfully.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

  FaithfullyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FaithfullyTests
        excludes:
          - "challenges.json"
      - path: FaithfullyTests/challenges.json
        type: file
        buildPhase: resources
    dependencies:
      - target: Faithfully
    settings:
      base:
        SWIFT_VERSION: "5.0"
        # Match the host app: an iPhone-only app must not carry universal test bundles.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Faithfully.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Faithfully"
        BUNDLE_LOADER: "$(TEST_HOST)"

  FaithfullyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FaithfullyUITests
    dependencies:
      - target: Faithfully
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
