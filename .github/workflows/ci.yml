name: CI

# Runs on every pull request and every push to main (restored 2026-08-03, #89).
#
# Automatic runs were off for two reasons, both now closed. Hosted macOS
# capacity was not being scheduled on the old plan; making the repository public
# fixed that. Then the first hosted run on the public repository went red in
# `ui-test` while passing locally — three tests whose result depended on the
# date the run happened to start (#89). A gate that is red for environmental
# reasons teaches everyone to ignore red, so the triggers stayed off until the
# cause was found rather than retried.
#
# See docs/ship/MERGE_CHECKLIST.md: CI cannot *block* a merge on this plan, so
# the checklist is still policy rather than mechanism.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gates first, so an obvious failure reports in ~2 minutes instead of
  # after a full simulator boot.
  static:
    name: Lint, project drift, content
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: echo "DEVELOPER_DIR=$(./scripts/select_xcode.sh)" >> "$GITHUB_ENV"

      - name: Cache pinned tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/versions.env') }}

      - run: make bootstrap
      - run: make verify-project
      - run: make validate-content
      - run: make lint

  test:
    name: Unit tests, coverage, analyzer, strict concurrency
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: echo "DEVELOPER_DIR=$(./scripts/select_xcode.sh)" >> "$GITHUB_ENV"

      - name: Report the resolved simulator
        run: ./scripts/resolve_simulator.sh

      - name: Cache pinned tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/versions.env') }}

      - run: make bootstrap
      - run: make test
      - run: make coverage
      - run: make analyze
      - run: make strict-concurrency

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/TestResults.xcresult
          retention-days: 14

  ui-test:
    name: UI tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: echo "DEVELOPER_DIR=$(./scripts/select_xcode.sh)" >> "$GITHUB_ENV"

      - name: Cache pinned tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/versions.env') }}

      - run: make bootstrap
      - run: make ui-test
      - run: make accessibility

      # A failed UI test is close to undiagnosable without the screenshots and
      # the element hierarchy the bundle carries.
      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          retention-days: 14

  archive:
    name: Release archive
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: echo "DEVELOPER_DIR=$(./scripts/select_xcode.sh)" >> "$GITHUB_ENV"

      - name: Cache pinned tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/versions.env') }}

      - run: make bootstrap
      # Also asserts the archive declares iPhone-only with no iPad orientations,
      # so the CLEAN-010 regression cannot come back unnoticed.
      - run: make archive

  # Single job to require in branch protection, so adding a check above does not
  # need the protection rule edited to match.
  required:
    name: All checks
    runs-on: ubuntu-latest
    needs: [static, test, ui-test, archive]
    if: always()
    steps:
      # A pure expression rather than shell. The previous version interpolated
      # the results into a single-quoted shell string and looped over them,
      # which reported a failure even when every job had succeeded — the gate
      # itself was the only thing failing.
      - name: Report job results
        run: echo "Results — ${{ join(needs.*.result, ', ') }}"

      - name: Fail if any required job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "A required check did not succeed." >&2
          exit 1
